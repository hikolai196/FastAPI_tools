<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ParsePics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="shell">
    <header class="hero">
      <p class="brand">ParsePics</p>
      <h1>把文件裡的圖抽出來</h1>
      <p class="lede">上傳 .docx / .pptx，自動轉成 PNG、標籤替換，並產生 Excel 對照表。</p>
    </header>

    <section class="panel" aria-labelledby="upload-title">
      <h2 id="upload-title" class="visually-hidden">上傳檔案</h2>

      <label class="dropzone" id="dropzone" for="file-input">
        <input
          id="file-input"
          type="file"
          accept=".docx,.pptx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation"
          multiple
        />
        <span class="dropzone-title">拖曳檔案到這裡，或點擊選擇</span>
        <span class="dropzone-hint">僅支援 .docx、.pptx；單檔上限 50 MB，一次最多 20 份</span>
      </label>

      <ul class="file-list" id="file-list" hidden></ul>

      <div class="actions">
        <button type="button" class="btn primary" id="process-btn" disabled>開始處理</button>
        <button type="button" class="btn ghost" id="clear-btn" disabled>清除</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="results" id="results" hidden aria-live="polite">
      <h2>處理結果</h2>
      <div id="results-body"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
